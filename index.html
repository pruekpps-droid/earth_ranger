<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PTT Sustainability SPARK – Earth Defender</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#0b1020;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;background:#000;max-width:100vw;max-height:100vh}
.ctl{position:fixed;bottom:18px;display:none;gap:14px;z-index:5}
.ctl.left{left:18px}.ctl.right{right:18px}
.btn{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5);color:#fff;font-size:24px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.btn.on{background:rgba(0,200,255,.45)}
.btn.fire{background:rgba(255,70,70,.35);width:80px;height:80px}
.btn.jump{background:rgba(80,220,120,.35)}
#rot{position:fixed;inset:0;background:#0b1020;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;z-index:10;padding:20px}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="270"></canvas></div>
<div class="ctl left"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div></div>
<div class="ctl right"><div class="btn jump" data-k="jump">⤒</div><div class="btn fire" data-k="fire">✦</div></div>
<div id="rot">📱↻<br><br>กรุณาหมุนโทรศัพท์เป็นแนวนอน<br>เพื่อเริ่มภารกิจปกป้องโลก</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=480,H=270,GROUND=226;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const touch=matchMedia('(pointer:coarse)').matches;
if(touch)document.querySelectorAll('.ctl').forEach(e=>e.style.display='flex');

// ---------- Input ----------
const K={left:0,right:0,jump:0,fire:0};
const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyJ:'fire',KeyZ:'fire',KeyX:'fire'};
addEventListener('keydown',e=>{if(map[e.code]){K[map[e.code]]=1;e.preventDefault()}
  if(state==='select'){if(e.code==='ArrowLeft'||e.code==='KeyA'){CH=0;beep(500,.05)}else if(e.code==='ArrowRight'||e.code==='KeyD'){CH=1;beep(500,.05)}else if(['Enter','Space','KeyJ','KeyZ','KeyX','ArrowUp','KeyW'].includes(e.code))startGame();return}
  tapStart()});
addEventListener('keyup',e=>{if(map[e.code])K[map[e.code]]=0});
document.querySelectorAll('.btn').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();K[k]=1;b.classList.add('on');if(state==='select'){if(k==='left')CH=0;else if(k==='right')CH=1;else startGame();return}tapStart()};
  const off=e=>{e.preventDefault();K[k]=0;b.classList.remove('on')};
  b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off);b.addEventListener('touchcancel',off);
  b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);
});
cv.addEventListener('pointerdown',e=>{if(state==='select'){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;if(x<W/2-10)CH=0;else if(x>W/2+10)CH=1;else return;
  if(CHlast===CH&&tick>15)startGame();else{CHlast=CH;beep(500,.05)}return}tapStart()});

// ---------- Audio ----------
let ac;function beep(f,d=.08,t='square',v=.05){try{ac=ac||new(AudioContext||webkitAudioContext)();const o=ac.createOscillator(),gn=ac.createGain();o.type=t;o.frequency.value=f;gn.gain.value=v;o.connect(gn);gn.connect(ac.destination);o.start();gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

// ---------- State ----------
let state='title',P,bullets,ebullets,enemies,items,parts,camX,score,spawnX,boss,shake,tick,co2,stageLen=3200,msg,msgT;
function reset(){
  P={x:60,y:GROUND,vx:0,vy:0,face:1,hp:5,inv:0,cd:0,gun:'normal',gunT:0,shield:0,anim:0,onG:true,swing:0};
  bullets=[];ebullets=[];enemies=[];items=[];parts=[];camX=0;score=0;spawnX=400;boss=null;shake=0;tick=0;co2=100;
  say('ภารกิจ: ขับไล่เอเลี่ยน CO₂ ฟื้นฟูโลก!');
}
function say(t){msg=t;msgT=150}
let CH=0,CHlast=-1;
function tapStart(){if(state==='title'||((state==='over'||state==='win')&&tick>0)){state='select';tick=0;CHlast=-1;beep(600,.08)}}
function startGame(){if(tick<15)return;reset();state='play';beep(660,.15)}

// ---------- Spawning ----------
const TYPES={
  blob:{w:22,h:20,hp:3,sp:.6,pts:100,col:'#6b6b6b'},  // CO2 blob
  drone:{w:24,h:14,hp:2,sp:1.2,pts:150,col:'#8a5a2b'},// smog drone (flies, drops)
  walker:{w:26,h:30,hp:6,sp:.4,pts:250,col:'#5b2a6e'} // methane walker (shoots)
};
function spawn(){
  while(spawnX<camX+W+80&&spawnX<stageLen-300){
    const r=Math.random(),t=r<.45?'blob':r<.75?'drone':'walker',T=TYPES[t];
    enemies.push({t,x:spawnX,y:t==='drone'?60+Math.random()*50:GROUND,w:T.w,h:T.h,hp:T.hp,cd:60+Math.random()*90,ph:Math.random()*6});
    if(Math.random()<.22){const k=['h2','solar','tree'][Math.floor(Math.random()*3)];items.push({k,x:spawnX+40,y:GROUND-60,vy:0})}
    spawnX+=90+Math.random()*110;
  }
  if(!boss&&camX>stageLen-W-20){boss={x:stageLen-110,y:GROUND,w:90,h:150,hp:160,max:160,cd:90,mcd:200,ph:0,hit:0,fire:0,spin:0};say('⚠ BOSS: i-SENSOR SKIBIDI MECHA!');beep(110,.6,'sawtooth',.08)}
}
function boom(x,y,c,n=10){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-1)*3,l:30+Math.random()*20,c})}
function hit(a,b){return a.x-a.w/2<b.x+b.w/2&&a.x+a.w/2>b.x-b.w/2&&a.y-a.h<b.y&&a.y>b.y-b.h}

// ---------- Update ----------
function update(){
  tick++;
  if(state!=='play')return;
  // player
  const acc=K.left?-1:K.right?1:0;
  P.vx=acc*2.2;if(acc)P.face=acc;
  if(K.jump&&P.onG){P.vy=-7.2;P.onG=false;beep(440,.06)}
  P.vy+=.35;P.x+=P.vx;P.y+=P.vy;
  if(P.y>=GROUND){P.y=GROUND;P.vy=0;P.onG=true}
  P.x=Math.max(camX+10,Math.min(P.x,boss?stageLen-20:stageLen));
  if(acc)P.anim++;
  if(P.inv>0)P.inv--;if(P.shield>0)P.shield--;
  if(P.gunT>0&&--P.gunT===0)P.gun='normal';
  if(P.cd>0)P.cd--;
  if(P.swing>0)P.swing--;
  if(K.fire&&P.cd<=0){
    const bx=P.x+P.face*24,by=P.y-20;
    if(CH===1){P.swing=14;axeHit()}
    const spd=CH===0?7.5:6.5,dmg=CH===0?1.2:1,col=CH===0?'#ffe14d':'#ff9ab0';
    if(P.gun==='h2'){[-.25,0,.25].forEach(a=>bullets.push({x:bx,y:by,vx:P.face*spd*Math.cos(a),vy:spd*Math.sin(a),w:7,h:4,d:dmg+1,c:'#7fe7ff'}));beep(980,.04,'triangle')}
    else{bullets.push({x:bx,y:by,vx:P.face*spd,vy:0,w:CH===0?9:5,h:CH===0?4:3,d:dmg,c:col});beep(CH===0?700:900,.03)}
    P.cd=CH===0?6:13;
  }
  // camera
  const tgt=Math.min(P.x-W*.4,stageLen-W);if(!boss||camX<stageLen-W)camX=Math.max(camX,tgt);
  spawn();
  // bullets
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
  bullets=bullets.filter(b=>b.x>camX-10&&b.x<camX+W+10&&!b.dead);
  // enemies
  enemies.forEach(e=>{
    const T=TYPES[e.t];e.ph+=.08;
    if(e.x<camX+W+20){
      if(e.t==='drone'){e.x-=T.sp*.7;e.y+=Math.sin(e.ph)*.8;if(--e.cd<0&&Math.abs(e.x-P.x)<120){ebullets.push({x:e.x,y:e.y,vx:0,vy:2.5,w:6,h:6,c:'#5a3a1a'});e.cd=110}}
      else{const dir=P.x<e.x?-1:1;e.x+=dir*T.sp;
        if(e.t==='walker'&&--e.cd<0){ebullets.push({x:e.x,y:e.y-20,vx:dir*3,vy:0,w:7,h:7,c:'#c03cff'});e.cd=120}}
    }
    bullets.forEach(b=>{if(!b.dead&&hit({x:b.x,y:b.y+2,w:b.w,h:b.h},e)){b.dead=1;e.hp-=b.d;e.fl=4;boom(b.x,b.y,'#fff',3)}});
    if(e.hp<=0&&!e.dead){e.dead=1;score+=T.pts;co2=Math.max(0,co2-1.6);boom(e.x,e.y-e.h/2,'#9be15d',14);beep(200,.12,'sawtooth')}
    if(!e.dead&&hit(e,{x:P.x,y:P.y,w:14,h:28}))hurt();
    if(e.fl)e.fl--;
  });
  enemies=enemies.filter(e=>!e.dead&&e.x>camX-60);
  // boss
  if(boss){const B=boss;B.ph+=.03;B.y=GROUND+Math.sin(B.ph)*0;if(B.hit)B.hit--;
    const rage=B.hp<B.max/2;B.spin+=B.fire>0?.6:.08;if(B.fire>0)B.fire--;
    if(--B.cd<0){const ga=B.ga||Math.PI,gx=B.x-50+Math.cos(ga)*40,gy=B.y-92+Math.sin(ga)*40,ang=Math.atan2(P.y-20-gy,P.x-gx);
      const n=rage?5:3;for(let i=0;i<n;i++){const a=ang+(i-(n-1)/2)*.16;ebullets.push({k:'laser',x:gx,y:gy,vx:Math.cos(a)*4,vy:Math.sin(a)*4,w:8,h:6,c:'#5ff6ff'})}
      B.fire=14;B.cd=rage?50:75;beep(1400,.08,'square',.04)}
    if(--B.mcd<0){const k=rage?3:2;for(let i=0;i<k;i++)ebullets.push({k:'missile',x:B.x+30,y:B.y-150,vx:-1.6-i*.9,vy:-3.2,w:8,h:8,c:'#ff4d4d',g:.09});
      B.mcd=rage?150:220;beep(300,.25,'sawtooth',.05);say(rage?'⚠ ALERT! บอสคลั่ง!':'⚠ ALERT! MISSILE!');msgT=60}
    bullets.forEach(b=>{if(!b.dead&&hit({x:b.x,y:b.y+2,w:b.w,h:b.h},B)){b.dead=1;B.hp-=b.d;B.hit=4;score+=10}});
    if(hit(B,{x:P.x,y:P.y,w:14,h:28}))hurt();
    if(B.hp<=0){for(let i=0;i<6;i++)boom(B.x+(Math.random()-.5)*100,B.y-Math.random()*150,i%2?'#9be15d':'#ffd34d',20);score+=5000;co2=0;boss=null;state='win';tick=-60;beep(523,.2,'triangle',.08);setTimeout(()=>beep(659,.2,'triangle',.08),200);setTimeout(()=>beep(784,.4,'triangle',.08),400)}
  }
  // enemy bullets
  ebullets.forEach(b=>{if(b.g)b.vy+=b.g;b.x+=b.vx;b.y+=b.vy;if(b.k==='missile'&&b.y>=GROUND-4){b.dead=1;boom(b.x,GROUND-6,'#ff9a1a',14);shake=6;beep(80,.2,'sawtooth',.06);if(Math.abs(b.x-P.x)<22&&P.y>GROUND-30)hurt()}if(hit({x:b.x,y:b.y+3,w:b.w,h:b.h},{x:P.x,y:P.y,w:14,h:28})){b.dead=1;hurt()}});
  ebullets=ebullets.filter(b=>!b.dead&&b.y<H&&b.y>-60&&b.x>camX-20&&b.x<camX+W+20);
  // items
  items.forEach(it=>{it.vy+=.2;it.y=Math.min(GROUND,it.y+it.vy);
    if(Math.abs(it.x-P.x)<16&&Math.abs(it.y-P.y)<24){it.dead=1;beep(1200,.1,'triangle');
      if(it.k==='h2'){P.gun='h2';P.gunT=600;say('ไฮโดรเจน! ปืนกระจาย 3 ทาง')}
      if(it.k==='solar'){P.shield=420;say('โซลาร์ชีลด์! อมตะชั่วคราว')}
      if(it.k==='tree'){P.hp=Math.min(5,P.hp+1);co2=Math.max(0,co2-3);say('ปลูกป่า! +1 พลังชีวิต / ลด CO₂')}
      score+=50}});
  items=items.filter(i=>!i.dead&&i.x>camX-20);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l--});parts=parts.filter(p=>p.l>0);
  if(shake>0)shake--;if(msgT>0)msgT--;
}
function axeHit(){const box={x:P.x+P.face*20,y:P.y+4,w:44,h:46};beep(260,.08);
  enemies.forEach(e=>{if(hit(box,e)){e.hp-=3;e.fl=5;boom(e.x,e.y-10,'#fff',6)}});
  if(boss&&hit(box,boss)){boss.hp-=4;boss.hit=5;score+=20;boom(boss.x-10,boss.y-40,'#fff',6)}}
function hurt(){if(P.inv>0||P.shield>0)return;P.hp--;P.inv=70;shake=10;beep(90,.2,'sawtooth',.08);if(P.hp<=0){state='over';tick=-60}}

// ---------- Draw helpers ----------
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function txt(t,x,y,s=12,c='#fff',a='center'){g.font=`bold ${s}px "Segoe UI",Tahoma,sans-serif`;g.textAlign=a;g.lineWidth=3;g.strokeStyle='#000';g.strokeText(t,x,y);g.fillStyle=c;g.fillText(t,x,y)}
function lerpC(a,b,t){if(!isFinite(t))t=0;t=Math.max(0,Math.min(1,t));const p=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}

function hr(i){const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)}
function fire(x,y,s,a){if(a<=0.02)return;g.globalAlpha=a;for(let k=0;k<3;k++){const f=Math.sin(tick*.4+x*.13+k*2)*2;
  g.fillStyle=['#ff5a1a','#ff9a1a','#ffe14d'][k];const ss=s*(1-k*.28);
  g.beginPath();g.moveTo(x-ss,y);g.quadraticCurveTo(x-ss*.6,y-ss*1.4,x+f,y-ss*2.2);g.quadraticCurveTo(x+ss*.6,y-ss*1.4,x+ss,y);g.fill()}g.globalAlpha=1}
function smoke(x,y,a,seed){if(a<=0.02)return;for(let k=0;k<6;k++){const t=((tick*.4+k*22+seed*13)%130)/130;
  g.fillStyle=`rgba(30,26,24,${a*(1-t)*.7})`;g.beginPath();g.arc(x+Math.sin(t*4+seed)*8+t*20,y-t*110,6+t*22,0,7);g.fill()}}
function tank(x,y,c){
  R(x-30,y-14,60,12,'#2a2a22');for(let k=0;k<6;k++){g.fillStyle='#4a4a3c';g.beginPath();g.arc(x-25+k*10,y-8,4,0,7);g.fill()}
  R(x-26,y-26,52,13,c);R(x-24,y-25,48,2,'rgba(255,255,255,.15)');R(x-12,y-36,24,11,c);
  g.save();g.translate(x+10,y-31);g.rotate(-.35);R(0,-2,30,5,'#4b4a33');g.restore();
  R(x-6,y-24,5,4,'#1c1c18');R(x+8,y-20,7,3,'#1c1c18')}
function drawBG(){
  const dirt=co2/100,clean=1-dirt;
  const sky=g.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,lerpC('#3a2a22','#3f8fd6',clean));sky.addColorStop(.55,lerpC('#b8642a','#8fcaf0',clean));sky.addColorStop(1,lerpC('#e09a4a','#d9f1ff',clean));
  g.fillStyle=sky;g.fillRect(0,0,W,GROUND);
  // drifting smoke clouds
  for(let i=0;i<7;i++){const x=((i*90-camX*.05-tick*.15)%630+630)%630-75;g.fillStyle=`rgba(40,32,28,${.45*dirt})`;
    g.beginPath();g.ellipse(x,40+(i%3)*18,60,14,0,0,7);g.fill()}
  if(clean>.05){g.fillStyle=`rgba(255,255,255,${clean*.8})`;for(let i=0;i<4;i++){const x=((i*150-camX*.05)%600+600)%600-60;g.beginPath();g.ellipse(x,45+i%2*20,30,9,0,0,7);g.fill()}}
  // far ruined skyline
  const p1=camX*.2;for(let i=-1;i<10;i++){const id=i+Math.floor(p1/58),x=id*58-p1,w=38+hr(id)*18,h=55+hr(id+7)*75,top=GROUND-30-h;
    g.fillStyle=lerpC('#3b2c26','#6d8fa0',clean);g.beginPath();g.moveTo(x,GROUND);g.lineTo(x,top+6);
    for(let k=0;k<=4;k++)g.lineTo(x+w*k/4,top+hr(id*5+k)*18);g.lineTo(x+w,GROUND);g.fill();
    for(let r=0;r<5;r++)for(let c=0;c<3;c++){if(hr(id*31+r*7+c)<.55)R(x+5+c*11,top+22+r*13,6,7,hr(id+r+c)<.2&&dirt>.3?'#ff8a2a':lerpC('#1e1714','#45606e',clean))}}
  // mid: rubble + wrecked tanks + fires
  const p2=camX*.5;for(let i=-1;i<4;i++){const id=i+Math.floor(p2/170),x=id*170-p2;
    g.fillStyle=lerpC('#3a2e26','#5a6e4e',clean);g.beginPath();g.moveTo(x-40,GROUND);g.lineTo(x-20,GROUND-22-hr(id)*14);g.lineTo(x+10,GROUND-14);g.lineTo(x+50,GROUND-30*hr(id+2));g.lineTo(x+90,GROUND);g.fill();
    if(hr(id+9)<.55)tank(x+40,GROUND,lerpC('#5a5838','#6f7a52',clean));
    else{g.strokeStyle='#2a201b';g.lineWidth=3;g.beginPath();g.moveTo(x,GROUND-10);g.lineTo(x+30,GROUND-40);g.lineTo(x+46,GROUND-30);g.stroke()}
    smoke(x+40,GROUND-30,dirt,id);fire(x+20+hr(id+4)*40,GROUND-4,8+hr(id)*6,dirt)}
  // ground
  R(0,GROUND,W,H-GROUND,lerpC('#4a3626','#4f7d3a',clean));R(0,GROUND,W,3,lerpC('#6e5338','#6fc04f',clean));
  for(let i=-1;i<26;i++){const id=i+Math.floor(camX/20),x=id*20-camX;R(x,GROUND+8+hr(id)*30,4+hr(id+1)*8,3,lerpC('#2e2219','#3d6a2a',clean))}
  if(clean>.4){g.globalAlpha=(clean-.4)/.6;for(let i=-1;i<12;i++){const id=i+Math.floor(camX/45),x=id*45-camX;R(x,GROUND-4,2,4,'#7ee05a');R(x+4,GROUND-3,2,3,'#7ee05a')}g.globalAlpha=1}
  const fx=stageLen-30-camX;if(fx<W){R(fx,GROUND-60,3,60,'#ddd');R(fx+3,GROUND-60,22,14,'#00a651')}
}
const SK=[{n:'BLUE RANGER',th:'ปืนไรเฟิลหนัก ยิงรัว',m:'#2f6fd6',d:'#1d3f8a',l:'#7fb0ff',hair:'#1a1a1a',ui:'#4fb3ff'},
          {n:'RED VALKYRIE',th:'ขวานฟันหนัก + ปืนพก',m:'#d23b55',d:'#8a1f33',l:'#ff8ea0',hair:'#e0457a',ui:'#ff4d4d'}];
function soldier(ch,x,y,f,sc,anim,run,swing,firing){
  const S=SK[ch],leg=run?Math.round(Math.sin(anim*.4)*3):0;
  g.save();g.translate(x,y);g.scale(f*sc,sc);
  // jetpack
  R(-16,-36,7,19,'#4a5058');R(-15,-38,5,3,'#7a828a');R(-15,-20,5,3,'#2b2e33');
  if(run){g.fillStyle='#ffb000';g.beginPath();g.moveTo(-15,-17);g.lineTo(-12,-10-Math.random()*4);g.lineTo(-9,-17);g.fill()}
  // legs
  R(-8+leg,-13,6,11,S.d);R(2-leg,-13,6,11,S.d);R(-8+leg,-9,6,3,S.l);R(2-leg,-9,6,3,S.l);
  R(-9+leg,-3,8,3,'#2b2e33');R(1-leg,-3,8,3,'#2b2e33');
  // torso
  R(-9,-26,18,14,S.m);R(-6,-25,12,5,S.l);R(-2,-20,4,5,'#c9ced4');R(-9,-14,18,2,'#00a651');

function tentacle(x0,y0,dir,len,ph,i,hl){
  const pts=[];for(let k=0;k<=10;k++){const t=k/10,a=dir+Math.sin(ph*1.5+i+t*3)*.5*t;
    pts.push([x0+Math.cos(a)*len*t+Math.sin(ph+i)*6*t*t,y0+Math.sin(a)*len*t*.55+t*t*18])}
  for(let pass=0;pass<2;pass++){g.strokeStyle=pass?(hl?'#fff':'#3d3046'):'#0c0a10';g.lineCap='round';
    for(let k=0;k<10;k++){const t=k/10;g.lineWidth=(pass?9:12)*(1-t*.75);g.beginPath();g.moveTo(pts[k][0],pts[k][1]);g.lineTo(pts[k+1][0],pts[k+1][1]);g.stroke()}}
  g.strokeStyle='#6a5a78';g.lineWidth=1.5;g.beginPath();g.moveTo(pts[0][0],pts[0][1]-2);for(let k=1;k<8;k++)g.lineTo(pts[k][0],pts[k][1]-3*(1-k/10));g.stroke();
  g.fillStyle='#c9c2b0';for(let k=2;k<9;k+=2){const [ax,ay]=pts[k],[bx,by]=pts[k+1],nx=-(by-ay),ny=bx-ax,nl=Math.hypot(nx,ny)||1,sz=5*(1-k/12);
    g.beginPath();g.moveTo(ax,ay);g.lineTo(ax-nx/nl*sz*1.8,ay-ny/nl*sz*1.8);g.lineTo(ax+(bx-ax)*.5,ay+(by-ay)*.5);g.fill()}
}
function porcelain(x,y,w,h,hl){const gr=g.createLinearGradient(x,0,x+w,0);
  gr.addColorStop(0,hl?'#fff':'#8d9399');gr.addColorStop(.35,hl?'#fff':'#eef1f3');gr.addColorStop(.7,hl?'#fff':'#c3c9cf');gr.addColorStop(1,hl?'#fff':'#6c737a');return gr}

  txt('เลือกตัวเอก',W/2,28,16,'#ffe14d');
  [0,1].forEach(i=>{const S=SK[i],cx=i?W*.75:W*.25,sel=CH===i;
    g.fillStyle=sel?'rgba(255,255,255,.15)':'rgba(0,0,0,.35)';g.fillRect(cx-95,40,190,190);
    g.strokeStyle=sel?S.ui:'#555';g.lineWidth=sel?3:1;g.strokeRect(cx-95,40,190,190);
    soldier(i,cx-8,175+(sel?Math.sin(tick*.15)*2:0),1,2.6,tick,false,i===1&&sel?(14-(tick%40)/40*14)*(tick%80<40):0,i===0&&sel&&tick%20<4);
    txt('PLAYER '+(i+1)+' • '+S.n,cx,198,11,S.ui);txt(S.th,cx,214,10,'#fff');
    if(sel)txt('▼',cx,52+Math.sin(tick*.2)*2,12,S.ui)});
  if(Math.floor(tick/30)%2)txt(touch?'แตะเลือกตัวละคร แตะซ้ำ/กด ✦ เพื่อเริ่ม':'← → เลือก • Enter/J เพื่อเริ่ม',W/2,254,11,'#fff');
}
function drawTitle(){
  drawBG();
  g.fillStyle='rgba(0,20,50,.55)';g.fillRect(0,0,W,H);
  txt('PTT SUSTAINABILITY SPARK',W/2,52,14,'#00e676');
  txt('EARTH DEFENDER',W/2,92,34,'#ffe14d');soldier(0,70,250,1,1.6,tick,false,0,false);soldier(1,W-70,250,-1,1.6,tick,false,0,false);
  txt('ปกป้องโลกจากเอเลี่ยน Climate Change',W/2,118,13,'#fff');
  const L=[['#00c3ff','H₂','ไฮโดรเจน = ปืนกระจาย'],['#ffcc00','☀','โซลาร์ = โล่ป้องกัน'],['#2ecc40','🌳','ต้นไม้ = เพิ่มชีวิต']];
  L.forEach((r,i)=>{const x=110+i*130;g.fillStyle=r[0];g.beginPath();g.arc(x-40,150,8,0,7);g.fill();txt(r[1],x-40,154,9);txt(r[2],x+10,154,9,'#fff')});
  txt(touch?'◀ ▶ เดิน   ⤒ กระโดด   ✦ ยิง':'← → เดิน   ↑/Space กระโดด   J/Z ยิง',W/2,190,11,'#9ee');
  if(Math.floor(tick/30)%2)txt(touch?'แตะเพื่อเริ่มภารกิจ':'กดปุ่มใดก็ได้เพื่อเริ่ม',W/2,225,15,'#fff');
}
function drawEnd(win){
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H);
  txt(win?'MISSION COMPLETE!':'GAME OVER',W/2,95,30,win?'#00e676':'#ff4d4d');
  txt(win?'โลกกลับมาสดใส ท้องฟ้าใส CO₂ = 0 🌏':'โลกยังต้องการคุณ ลองใหม่อีกครั้ง!',W/2,125,13);
  txt('SCORE: '+score,W/2,155,18,'#ffe14d');
  txt('ร่วมขับเคลื่อนสู่ Net Zero ไปกับ ปตท.',W/2,185,11,'#9ee');
  if(tick>0&&Math.floor(tick/30)%2)txt(touch?'แตะเพื่อเลือกตัวละครและเล่นอีกครั้ง':'กดปุ่มใดก็ได้เพื่อเล่นอีกครั้ง',W/2,225,13);
}

function draw(){
  if(state==='title'){drawTitle();return}
  if(state==='select'){drawSelect();return}
  g.save();if(shake)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBG();
  items.forEach(drawItem);
  enemies.forEach(drawEnemy);
  if(boss)drawBoss();
  drawPlayer();
  bullets.forEach(b=>{R(b.x-camX-b.w/2,b.y,b.w,b.h,b.c);R(b.x-camX-b.w/2-b.vx,b.y,b.w,b.h,'rgba(255,255,255,.3)')});
  ebullets.forEach(b=>{const x=b.x-camX,y=b.y+3;
    if(b.k==='laser'){const l=Math.hypot(b.vx,b.vy);g.strokeStyle='rgba(95,246,255,.35)';g.lineWidth=6;g.beginPath();g.moveTo(x,y);g.lineTo(x-b.vx/l*16,y-b.vy/l*16);g.stroke();g.strokeStyle='#e6ffff';g.lineWidth=2;g.stroke()}
    else if(b.k==='missile'){g.save();g.translate(x,y);g.rotate(Math.atan2(b.vy,b.vx));R(-8,-2,14,5,'#d9dde2');R(4,-2,4,5,'#e0302a');R(-10,-4,3,9,'#7a828a');
      g.fillStyle=tick%4<2?'#ffe14d':'#ff7a1a';g.beginPath();g.moveTo(-10,-2);g.lineTo(-17-Math.random()*4,.5);g.lineTo(-10,3);g.fill();g.restore();
      if(tick%3==0)parts.push({x:b.x-b.vx*2,y:b.y+3,vx:0,vy:-.2,l:18,c:'#777'})}
    else{g.fillStyle=b.c;g.beginPath();g.arc(x,y,b.w/2,0,7);g.fill()}});
  parts.forEach(p=>{g.globalAlpha=p.l/50;R(p.x-camX,p.y,3,3,p.c)});g.globalAlpha=1;
  g.restore();
  drawHUD();
  if(state==='over')drawEnd(false);
  if(state==='win')drawEnd(true);
}
let last=0,accT=0;
function loop(t){accT+=Math.min(50,t-last);last=t;while(accT>=16.67){update();accT-=16.67}draw();requestAnimationFrame(loop)}
reset();msgT=0;requestAnimationFrame(loop);
</script>
